name: Bug report
description: kinemo does something wrong, crashes, or a diagnostic is misleading.
labels: [bug]
body:
  - type: textarea
    id: scene
    attributes:
      label: Smallest scene that shows it
      description: A complete scene file, as short as you can make it.
      render: python
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happens, and what you expected
      description: Paste the `kinemo check` output or the traceback if there is one.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: kinemo doctor
      description: Output of `kinemo doctor` (versions, platform, ffmpeg, extras).
      render: text
    validations:
      required: true
