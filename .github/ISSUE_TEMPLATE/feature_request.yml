name: Feature request
description: Something you wanted to animate and could not, or could only do awkwardly.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What you want to show
      description: The explanation or animation you are building, and where kinemo gets in the way.
    validations:
      required: true
  - type: textarea
    id: today
    attributes:
      label: How you do it today
      description: Your current code, if any.
      render: python
  - type: textarea
    id: proposal
    attributes:
      label: What you would like to write
      description: Optional. The API you imagine, as code.
      render: python
