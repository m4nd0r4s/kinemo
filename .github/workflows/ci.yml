name: ci

# Pull requests run here; branch pushes would run the same commits a second time.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Only the latest commit of a branch (or of main) runs: a new push cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ffmpeg
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        if: runner.os != 'Windows'
      # The optional GPU backend (not in the wheels) crashes inside wgpu on the Windows
      # runner, which has no GPU and offers a software adapter; elsewhere its tests skip
      # themselves when no adapter exists. Clippy above still checks it everywhere.
      - run: cargo test --workspace --exclude kinemo-render-gpu
        if: runner.os == 'Windows'

  # The extension is abi3 (Python 3.11+): one wheel per platform serves every Python version,
  # so it is built once here and the test jobs only install it.
  wheel:
    name: wheel (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: pip install maturin
      - run: maturin build --release --out dist
      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: dist
          retention-days: 1

  python:
    name: python ${{ matrix.python }} (${{ matrix.os }})
    needs: wheel
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-14, windows-latest]
        # Pull requests try the oldest and newest Python; main runs every version.
        python: ${{ fromJSON(github.event_name == 'pull_request' && '["3.11", "3.14"]' || '["3.11", "3.12", "3.13", "3.14"]') }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: wheel-${{ matrix.os }}
          path: dist
      - run: pip install pytest numpy polars pyarrow pandas
      # The wheel file itself: `--find-links dist kinemo` may pick the PyPI release of the
      # same version instead of this build.
      - run: pip install --force-reinstall dist/*.whl
        shell: bash
      - run: pytest -q
        env:
          # Golden PNGs are byte-identical on the reference CPU renderer; performance
          # thresholds are checked on the dedicated job below.
          KINEMO_SKIP_PERF: "1"

  # The same on every platform and Python version: checked once.
  typecheck:
    needs: wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/download-artifact@v8
        with:
          name: wheel-ubuntu-latest
          path: dist
      - run: pip install pyright numpy polars pyarrow pandas dist/*.whl
      - run: pyright python/kinemo

  performance:
    needs: wheel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: wheel-macos-14
          path: dist
      - run: pip install pytest numpy polars && pip install --force-reinstall dist/*.whl
      - run: pytest -q tests/python/test_performance.py

  # Stage timings of the example and benchmark scenes on main, kept as an artifact and shown in
  # the job summary so a slower commit is visible (`python -m benchmarks`).
  benchmarks:
    if: github.event_name == 'push'
    needs: wheel
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: ./.github/actions/ffmpeg
      - uses: actions/download-artifact@v8
        with:
          name: wheel-macos-14
          path: dist
      - run: pip install numpy polars && pip install --force-reinstall dist/*.whl
      - run: python -m benchmarks --json benchmarks.json --markdown "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        with:
          name: benchmarks-${{ github.sha }}
          path: benchmarks.json
          retention-days: 90

  # The website builds and type-checks (videos and timings are left to the Pages workflow).
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/ffmpeg
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Build kinemo
        run: |
          python -m venv .venv
          .venv/bin/pip install maturin pytest numpy polars
          source .venv/bin/activate && maturin develop
      - name: Type-check the site
        working-directory: website
        run: npm ci && npm run check
      # Exports the data, builds the site into a temporary folder and checks every link.
      - run: .venv/bin/python -m pytest -q tests/python/test_website.py
