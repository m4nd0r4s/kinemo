[package]
name = "kinemo-code"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
kinemo-text.workspace = true
kurbo.workspace = true
serde.workspace = true
serde_json.workspace = true
tree-sitter = { workspace = true, optional = true }
tree-sitter-highlight = { workspace = true, optional = true }
tree-sitter-python = { workspace = true, optional = true }
tree-sitter-rust = { workspace = true, optional = true }
tree-sitter-javascript = { workspace = true, optional = true }
tree-sitter-typescript = { workspace = true, optional = true }
tree-sitter-c = { workspace = true, optional = true }
tree-sitter-cpp = { workspace = true, optional = true }
tree-sitter-json = { workspace = true, optional = true }
tree-sitter-java = { workspace = true, optional = true }
tree-sitter-go = { workspace = true, optional = true }
tree-sitter-bash = { workspace = true, optional = true }
tree-sitter-kotlin-ng = { workspace = true, optional = true }
tree-sitter-ruby = { workspace = true, optional = true }
tree-sitter-c-sharp = { workspace = true, optional = true }
tree-sitter-swift = { workspace = true, optional = true }
tree-sitter-haskell = { workspace = true, optional = true }
tree-sitter-html = { workspace = true, optional = true }
tree-sitter-css = { workspace = true, optional = true }
tree-sitter-yaml = { workspace = true, optional = true }
tree-sitter-toml-ng = { workspace = true, optional = true }
tree-sitter-sequel = { workspace = true, optional = true }

[features]
# Highlighting with the tree-sitter grammars (C code). Without it (the WASM player), tokens come
# from `baked`: computed at build time and shipped with the lesson.
default = ["grammars"]
grammars = ["dep:tree-sitter", "dep:tree-sitter-highlight", "dep:tree-sitter-python", "dep:tree-sitter-rust", "dep:tree-sitter-javascript", "dep:tree-sitter-typescript", "dep:tree-sitter-c", "dep:tree-sitter-cpp", "dep:tree-sitter-json", "dep:tree-sitter-java", "dep:tree-sitter-go", "dep:tree-sitter-bash", "dep:tree-sitter-kotlin-ng", "dep:tree-sitter-ruby", "dep:tree-sitter-c-sharp", "dep:tree-sitter-swift", "dep:tree-sitter-haskell", "dep:tree-sitter-html", "dep:tree-sitter-css", "dep:tree-sitter-yaml", "dep:tree-sitter-toml-ng", "dep:tree-sitter-sequel"]
