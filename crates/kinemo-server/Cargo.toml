[package]
name = "kinemo-server"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Preview server for `kinemo dev`: embedded web UI, frames and picking over WebSocket."

[dependencies]
kinemo-ir.workspace = true
kinemo-eval.workspace = true
kinemo-layout.workspace = true
kinemo-render.workspace = true
kurbo.workspace = true
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
kinemo-render-gpu = { workspace = true, optional = true }

[features]
default = []
# Rasterize preview frames with Vello on the GPU when an adapter exists (CPU fallback).
gpu = ["dep:kinemo-render-gpu"]
