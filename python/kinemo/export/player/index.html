<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{title}</title>
<link rel="stylesheet" href="player.css">
<link rel="modulepreload" href="pkg/kinemo_web.js">
</head>
<body>
<main class="lesson">
  <div class="stage" id="stage">
    <canvas id="frame" width="960" height="540" aria-label="{title}" role="img"></canvas>
    <div class="handle" id="handle" tabindex="0" role="slider" aria-label="Point to drag (arrow keys move it)" hidden></div>
    <p class="status" id="status">Loading…</p>
  </div>
  <div class="controls">
    <button type="button" class="play" id="play" aria-label="Play" data-state="paused"></button>
    <input type="range" class="scrub" id="scrub" min="0" max="1" step="any" value="0" aria-label="Position in the lesson">
    <span class="time" id="time">0:00 / 0:00</span>
    <button type="button" class="restart" id="restart" aria-label="Start over">↺</button>
  </div>
  <section class="question" id="question" aria-live="polite" hidden></section>
</main>
<script type="module" src="player.js"></script>
</body>
</html>
